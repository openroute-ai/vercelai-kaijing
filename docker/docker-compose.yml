# 运行已构建的薄云镜像。本地数据库用仓库根目录的 docker-compose.yml。
services:
  web:
    image: kaijing-web:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ../.env

  docs:
    image: kaijing-docs:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "6969:6969"
    environment:
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}

  api:
    image: kaijing-api:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ../.env
